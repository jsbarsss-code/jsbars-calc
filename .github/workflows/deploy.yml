name: 배포

# 데이터는 비공개 저장소의 주간 작업이 data 브랜치로 올리고 이 작업을 실행한다. 여기서는 화면 + data 브랜치를 배포하고, 데이터로 검색용 단지·지역·분양 페이지와 sitemap.xml을 만든다(build_pages.py).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 데이터 가져오기
        run: |
          mkdir -p site/data
          if git fetch -q origin data --depth 1; then
            git archive FETCH_HEAD | tar -x -C site/data
          else
            echo "data 브랜치 없음 — 검색 없이 배포"
          fi
      - name: 사이트 조립
        run: |
          cp index.html terms.html plan.html og.png site/
          python3 build_pages.py site
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
