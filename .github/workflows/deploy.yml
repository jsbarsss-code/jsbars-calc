name: 데이터 갱신·배포

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * 0"   # 매주 월요일 03:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 인증키(DATA_GO_KR_KEY)가 저장소 Secret에 있을 때만 새로 만든다. 없으면 기존 data 브랜치를 그대로 쓴다.
      - name: 공공데이터로 JSON 생성 (주간·수동 실행)
        id: build
        if: github.event_name != 'push'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          if [ -z "$DATA_GO_KR_KEY" ]; then echo "Secret 없음 — 기존 데이터 사용"; echo "fresh=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          python scripts/build_data.py --out site/data
          echo "fresh=1" >> "$GITHUB_OUTPUT"

      - name: data 브랜치에 덮어쓰기 저장 (히스토리 1개만 유지)
        if: steps.build.outputs.fresh == '1'
        run: |
          cd site/data
          git init -q -b data
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "data $(date -u +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      - name: 기존 데이터 가져오기
        if: steps.build.outputs.fresh != '1'
        run: |
          mkdir -p site/data
          if git fetch -q origin data --depth 1; then
            git archive FETCH_HEAD | tar -x -C site/data
          else
            echo "data 브랜치 없음 — 검색 없이 배포"
          fi

      - name: 사이트 조립
        run: |
          cp index.html site/
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
