<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23155c45%22/%3E%3Ccircle cx=%2222%22 cy=%2232%22 r=%2210%22 fill=%22none%22 stroke=%22%23f3c35a%22 stroke-width=%226%22/%3E%3Cpath d=%22M32 32h22M46 32v9M53 32v7%22 stroke=%22%23f3c35a%22 stroke-width=%226%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<title>우리집 열쇠 · 입주 일정표</title>
<meta name="robots" content="noindex">
<script>
  // 입주 일정표는 메인 페이지의 탭으로 옮겼다. 옛 주소·가족 공유 링크(#v=...)를 그대로 넘긴다.
  (function () {
    var s = location.search, h = location.hash;
    var q = s ? s + (/[?&]to=plan/.test(s) ? "" : "&to=plan") : "";
    location.replace("./" + q + (/^#v=/.test(h) ? h : "#plan"));
  })();
</script>
</head>
<body style="font-family:sans-serif;padding:24px">
<p>입주 일정표로 이동 중이에요. 자동으로 넘어가지 않으면 <a href="./#plan">여기를 눌러 주세요</a>.</p>
</body>
</html>
