<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리집 열쇠 · 입주 일정표</title>
<meta name="robots" content="noindex">
<script>
  // 입주 일정표는 메인 페이지의 탭으로 옮겼다. 옛 주소·가족 공유 링크(#v=...)를 그대로 넘긴다.
  (function () {
    var s = location.search, h = location.hash;
    var q = s ? s + (/[?&]to=plan/.test(s) ? "" : "&to=plan") : "";
    location.replace("./" + q + (/^#v=/.test(h) ? h : "#plan"));
  })();
</script>
</head>
<body style="font-family:sans-serif;padding:24px">
<p>입주 일정표로 이동 중이에요. 자동으로 넘어가지 않으면 <a href="./#plan">여기를 눌러 주세요</a>.</p>
</body>
</html>
